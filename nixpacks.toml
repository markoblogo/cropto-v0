[phases.setup]
# Force Node 22 even if Nixpacks defaults to an older Node.
nixPkgs = ["nodejs_22", "npm-10_x", "openssl"]
# Playwright Chromium runtime dependencies for Debian-based images.
# Railway uses Nixpacks; these packages must exist in the runtime layer (not just build),
# otherwise Playwright will fail to launch the browser.
aptPkgs = [
  "libglib2.0-0",
  "libnss3",
  "libnspr4",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdbus-1-3",
  "libdrm2",
  "libx11-6",
  "libx11-xcb1",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxext6",
  "libxfixes3",
  "libxrandr2",
  "libgbm1",
  # Ubuntu 24.04 uses the t64 transition packages.
  "libasound2t64",
  "libpango-1.0-0",
  "libpangocairo-1.0-0",
  "libcairo2",
  "libatspi2.0-0",
  "libgtk-3-0",
  "ca-certificates",
  "fonts-liberation",
]

[start]
# Nixpacks defaults to running Caddy. This app already serves the SPA + API via Express,
# and Railway expects the app to bind to $PORT.
cmd = "npm run start"

[variables]
# Nixpacks sometimes falls back to Node 18 if it can't infer a version.
# Force the runtime to Node 22 to avoid undici/cheerio web API issues on Node 18.
NIXPACKS_NODE_VERSION = "22"
